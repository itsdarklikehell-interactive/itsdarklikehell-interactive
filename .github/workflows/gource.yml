name: Gource visualization

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
      - ".github/workflows/gource.yml"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  workflow_dispatch:

concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Render Gource video
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_title: "${{ github.event.repository.name }} | Development History"
          gource_resolution: "1080p"
          gource_fps: 60
          gource_auto_skip_seconds: 0.65
          gource_seconds_per_day: 0.12
          gource_time_scale: 1.5
          gource_font_size: 38
          gource_font_color: "E8EAF0"
          gource_background_color: "070B16"
          gource_overlay_background_color: "10182A"
          gource_bloom_multiplier: 0.5
          gource_bloom_intensity: 0.5
          gource_key: "--key"
          gource_camera_mode: "overview"
          gource_hide_items: "mouse"
          gource_user_scale: 1.25
          gource_dir_depth: 3
          gource_filename_time: 3.5
          # Exclude the generated video to prevent a self-referential history.
          gource_file_filter: '(^|/)gource\\.mp4$|(__pycache__|\\.pyc|node_modules|\\.git/)'
          avatars_auto_fetch: true

      - name: Verify rendered video
        run: test -s ./gource/gource.mp4

      - name: Upload Gource video
        uses: actions/upload-artifact@v4
        with:
          name: gource-${{ github.event.repository.name }}
          path: ./gource/gource.mp4
          if-no-files-found: error
          retention-days: 14

  publish:
    # PRs produce review artifacts only. Publish a durable root-level MP4 from the default branch.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: gource
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download rendered video
        uses: actions/download-artifact@v4
        with:
          name: gource-${{ github.event.repository.name }}
          path: ./gource-artifact

      - name: Publish root-level gource.mp4
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cp ./gource-artifact/gource.mp4 ./gource.mp4
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4
          if git diff --cached --quiet; then
            echo "Gource video is already up to date."
          else
            git commit -m "chore: publish refreshed Gource video"
            if git push; then
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Direct push to the default branch was rejected; opening a pull request instead."
              git reset --soft HEAD~1
              echo "needs_pr=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open or update publication PR for protected default branch
        if: steps.publish.outputs.needs_pr == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/gource-video-update
          delete-branch: true
          add-paths: gource.mp4
          title: "chore: publish refreshed Gource video"
          commit-message: "chore: publish refreshed Gource video"
          body: |
            This PR publishes the latest generated root-level Gource video.

            The default branch rejected a direct push, so the video is being submitted through the repository's normal pull-request protections. No checks or branch protections are bypassed.
