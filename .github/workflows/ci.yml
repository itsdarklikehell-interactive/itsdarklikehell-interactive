name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  shellcheck-shfmt:
    name: Shell lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mkdir -p /tmp/shfmt && cd /tmp/shfmt
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.7.0/shfmt_v3.7.0_linux_amd64 -o shfmt
          chmod +x shfmt && sudo mv shfmt /usr/local/bin/
      - name: Run shellcheck
        run: shellcheck *.sh scripts/*.sh 2>/dev/null || true
      - name: Run shfmt
        run: shfmt -d *.sh scripts/*.sh 2>/dev/null || true

  rust-build-test:
    name: Rust build + test (nightly, zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Build with warnings as errors
        run: RUSTFLAGS='-D warnings' cargo build --release
      - name: Run tests
        run: cargo test

  docker-sandbox:
    name: Docker Compose validate + build
    runs-on: ubuntu-latest
    needs: [shellcheck-shfmt, rust-build-test]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose config
        run: docker compose config
      - name: Build veloren-agent service
        run: docker compose build veloren-agent
