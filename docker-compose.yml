# Company infrastructure — development services shared across projects
version: '3.8'

services:
  # Kanban board (Hermes)
  kanban:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    volumes:
      - kanban-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Dashboard (shared)
  dashboard:
    build:
      context: ../veloren-agent-intergration
      dockerfile: Dockerfile.dashboard
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=5000
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY}
      - VELOREN_USERNAME=${VELOREN_USERNAME}
      - VELOREN_PASSWORD=${VELOREN_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      - veloren-server
    restart: unless-stopped

  # Veloren dedicated server
  veloren-server:
    image: rust:1.99
    command: sh -c "rustup toolchain install nightly && rustup default nightly && ./veloren-server-cli --non-interactive"
    volumes:
      - ./veloren-server-data:/var/lib/veloren/server
    ports:
      - "14004:14004"
    restart: unless-stopped

volumes:
  kanban-data:
  veloren-server-data: